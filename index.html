<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prompt Crash — Compound Word Game</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./style.css" />
<!-- the "turn your phone sideways" hint is for phones only: an iPad's narrow Split View / Slide Over pane looks like an
     upright phone to the CSS query, so a screen whose short side is over 500 px (every tablet) never shows it -->
<style>.not-phone .rotate-hint { display: none !important; }</style>
<script>try { if (Math.min(screen.width, screen.height) > 500) document.documentElement.classList.add('not-phone'); } catch (e) { /* no screen info */ }</script>
</head>
<body>
  <div id="game-container"></div>
  <!-- phones held upright only (style.css): turn it sideways — the same hint in every phonics game -->
  <div class="rotate-hint" role="status">
    <svg viewBox="0 0 64 64" aria-hidden="true"><g class="rh-dev"><rect x="21" y="14" width="22" height="36" rx="4" /><path d="M29 44.5h6" /></g><g class="rh-arrow"><path d="M58.6 27.3A27 27 0 0 0 36.7 5.4" /><path d="M41.7 3.1 36.7 5.4 40.6 9.3" /></g></svg>
    <p>Turn your phone sideways</p>
  </div>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
